<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .container {
            background-color: #ffffff;
            color: #333333;
            padding: 2rem;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1.1rem;
        }
        .output-box {
            background-color: #f4f4f4;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #ddd;
            word-break: break-all;
            font-family: monospace;
            font-size: 0.9rem;
            margin-bottom: 15px;
            min-height: 50px;
        }
        .copy-btn {
            background-color: #333;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .copy-btn:hover {
            background-color: #555;
        }
        .copy-btn:active {
            transform: scale(0.98);
        }
        .label {
            font-weight: bold;
            display: block;
        }
        #copy-status {
            margin-left: 10px;
            font-size: 0.8rem;
            color: green;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <label class="label">a = (diameter)</label>
        <input type="number" id="inputA" placeholder="Enter a number..." value="1">

        <div class="label" style="margin-bottom: 5px;">Result:</div>
        <div id="output" class="output-box"></div>

        <div style="display: flex; align-items: center;">
            <button class="copy-btn" onclick="copyToClipboard()">Copy</button>
            <span id="copy-status">Copied!</span>
        </div>
    </div>

    <script>
        const inputA = document.getElementById('inputA');
        const output = document.getElementById('output');
        const copyStatus = document.getElementById('copy-status');

        const baseTemplate = "execute as @a at @s rotated as @e[tag=rdm,type=armor_stand] positioned ^^^a/64 rotated as @e[tag=rdm,type=armor_stand] positioned ^^^a/32 rotated as @e[tag=rdm,type=armor_stand] positioned ^^^a/16 rotated as @e[tag=rdm,type=armor_stand] positioned ^^^a/8 rotated as @e[tag=rdm,type=armor_stand] positioned ^^^a/4 rotated as @r[tag=rdm,type=armor_stand] positioned ^a/64^^ rotated as @r[tag=rdm,type=armor_stand] positioned ^a/32^^ rotated as @r[tag=rdm,type=armor_stand] positioned ^a/16^^ rotated as @r[tag=rdm,type=armor_stand] positioned ^a/8^^ rotated as @r[tag=rdm,type=armor_stand] positioned ^a/4^^ rotated as @r[tag=rdm,type=boat] positioned ^^^a/64 rotated as @r[tag=rdm,type=boat] positioned ^^^a/32 rotated as @r[tag=rdm,type=boat] positioned ^^^a/16 rotated as @r[tag=rdm,type=boat] positioned ^^^a/8 rotated as @r[tag=rdm,type=boat] positioned ^^^a/4 if entity @s[r=a/2] run";

        function updateCommand() {
            const aValue = parseFloat(inputA.value);
            
            if (isNaN(aValue)) {
                output.innerText = "Please enter a valid number";
                return;
            }

            let result = baseTemplate.replace(/a\/(\d+)/g, (match, divisor) => {
                return (aValue / parseInt(divisor)).toString();
            });

            result = result.replace(/a\/2/g, (aValue / 2).toString());
            
            output.innerText = result;
        }

        function copyToClipboard() {
            const text = output.innerText;
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                copyStatus.style.display = "inline";
                setTimeout(() => {
                    copyStatus.style.display = "none";
                }, 2000);
            } catch (err) {}
            document.body.removeChild(textArea);
        }

        inputA.addEventListener('input', updateCommand);
        window.onload = updateCommand;
    </script>
</body>
</html>
