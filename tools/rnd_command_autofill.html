    <script>
        const inputA = document.getElementById('inputA');
        const particleSelect = document.getElementById('particleSelect');
        const output = document.getElementById('output');
        const copyStatus = document.getElementById('copy-status');

        const baseTemplate = "execute as @a at @s rotated as @e[tag=rdm,type=armor_stand] positioned ^^^a/64 rotated as @e[tag=rdm,type=armor_stand] positioned ^^^a/32 rotated as @e[tag=rdm,type=armor_stand] positioned ^^^a/16 rotated as @e[tag=rdm,type=armor_stand] positioned ^^^a/8 rotated as @e[tag=rdm,type=armor_stand] positioned ^^^a/4 rotated as @r[tag=rdm,type=armor_stand] positioned ^a/64^^ rotated as @r[tag=rdm,type=armor_stand] positioned ^a/32^^ rotated as @r[tag=rdm,type=armor_stand] positioned ^a/16^^ rotated as @r[tag=rdm,type=armor_stand] positioned ^a/8^^ rotated as @r[tag=rdm,type=armor_stand] positioned ^a/4^^ rotated as @r[tag=rdm,type=boat] positioned ^^^a/64 rotated as @r[tag=rdm,type=boat] positioned ^^^a/32 rotated as @r[tag=rdm,type=boat] positioned ^^^a/16 rotated as @r[tag=rdm,type=boat] positioned ^^^a/8 rotated as @r[tag=rdm,type=boat] positioned ^^^a/4 if entity @s[r=a/2] ";

        function updateCommand() {
            const aValueStr = inputA.value;
            const aValue = parseFloat(aValueStr);
            const particle = particleSelect.value;
            
            if (isNaN(aValue)) {
                output.innerText = "Enter a valid diameter";
                return;
            }

            let result = baseTemplate.replace(/a\/(\d+)/g, (match, divisor) => {
                return (aValue / parseInt(divisor)).toString();
            });

            result = result.replace(/a\/2/g, (aValue / 2).toString());
            
            if (particle === "") {
                result += "run [your command here]";
            } else {
                result += "run particle " + particle ;
            }

            output.innerText = result;
        }

        function copyToClipboard() {
            const text = output.innerText;
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                copyStatus.style.display = "inline";
                setTimeout(() => {
                    copyStatus.style.display = "none";
                }, 2000);
            } catch (err) {}
            document.body.removeChild(textArea);
        }

        inputA.addEventListener('input', updateCommand);
        particleSelect.addEventListener('change', updateCommand);
        window.onload = updateCommand;
    </script>
